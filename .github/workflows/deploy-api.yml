name: Deploy API (Render)

on:
  push:
    branches:
      - release

# 同時デプロイを防ぐ（キャンセルではなくキューイング）
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ────────────────────────────────────────────
  # Job 1: CI チェック（デプロイ前の安全確認）
  # ────────────────────────────────────────────
  pre-deploy-check:
    name: Pre-deploy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-api-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-api-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm build

      - name: Unit test
        run: pnpm test

  # ────────────────────────────────────────────
  # Job 2: Render デプロイフック呼び出し
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to Render (Production)
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production

    steps:
      - name: Trigger Render deploy hook
        id: trigger
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "status=$response" >> $GITHUB_OUTPUT
          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            echo "Render deploy hook failed with status: $response"
            exit 1
          fi
          echo "Render deploy triggered successfully (HTTP $response)"

      # Render のデプロイ完了をポーリング（最大 10 分）
      - name: Wait for Render deploy to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Waiting for Render service to become live..."
          for i in $(seq 1 20); do
            sleep 30
            status=$(curl -s \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['deploy']['status'])" 2>/dev/null || echo "unknown")
            echo "Deploy status: $status (attempt $i/20)"
            if [ "$status" = "live" ]; then
              echo "Deploy completed successfully."
              exit 0
            elif [ "$status" = "deactivated" ] || [ "$status" = "build_failed" ]; then
              echo "Deploy failed with status: $status"
              exit 1
            fi
          done
          echo "Timeout waiting for deploy to complete."
          exit 1

      - name: Comment deploy result on commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const sha = context.sha.slice(0, 7);
            const icon = success ? '🚀' : '❌';
            const label = success ? 'API デプロイ完了' : 'API デプロイ失敗';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `${icon} **${label}** (${sha})\n\nRender サービスへのデプロイが${success ? '完了しました' : '失敗しました'}。`,
            });

  # ────────────────────────────────────────────
  # 必要シークレット（GitHub Secrets に登録）
  # ────────────────────────────────────────────
  # RENDER_DEPLOY_HOOK_URL : Render > Service > Settings > Deploy Hook で発行
  # RENDER_API_KEY         : Render > Account > API Keys で発行
  # RENDER_SERVICE_ID      : Render サービスの ID（srv-xxxxxxxxxx 形式）
