openapi: 3.1.0
info:
  title: FamBiz API
  description: 家庭内タスク管理・お小遣い管理サービス FamBiz のREST API仕様（プロトタイプ版）
  version: 1.1.0
servers:
- url: https://api.fambiz.example.com/v1
  description: 本番想定エンドポイント
- url: http://localhost:3000/v1
  description: ローカル開発環境

security:
- bearerAuth: []

tags:
- name: AUTH
  description: 認証・ユーザー管理
- name: GROUP
  description: 家族グループ管理
- name: TASK
  description: タスク（お手伝い）管理
- name: GOAL
  description: 目標（マンスリーゴール）管理
- name: REWARD
  description: 報酬・月次評価管理

paths:
  /auth/register:
    post:
      summary: ユーザー登録（FUN-AUTH-001）
      tags: [AUTH]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 登録成功（アクセストークンを返却）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: メールアドレスが既に使用されている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: ログイン（FUN-AUTH-002）
      tags: [AUTH]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/logout:
    post:
      summary: ログアウト・セッション破棄（FUN-AUTH-003）
      tags: [AUTH]
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      summary: ログイン中ユーザーのプロフィール取得
      tags: [AUTH]
      responses:
        '200':
          description: プロフィール取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: プロフィール更新（FUN-AUTH-006）
      tags: [AUTH]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: アカウント削除（FUN-AUTH-007）
      tags: [AUTH]
      responses:
        '200':
          description: アカウント削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups:
    post:
      summary: 家族グループ登録（親のみ・FUN-GROUP-001）
      tags: [GROUP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '201':
          description: グループ作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # /groups/join/preview・/groups/join は静的パスのため /groups/{groupId} より先に定義する（NestJS ルーティング優先順）
  /groups/join/preview:
    get:
      summary: 招待コードによるグループ情報プレビュー取得
      description: |
        招待URLからアクセスした未参加ユーザーが参加前にグループ情報を確認するためのエンドポイント。
        groups テーブルの RLS は所属グループのみ参照可能に制限されているため、
        service_role キー（RLS バイパス）を使用する NestJS 経由でのみ取得できる。
        認証必須・ロール制限なし。
      tags: [GROUP]
      parameters:
        - name: inviteCode
          in: query
          required: true
          schema:
            type: string
          description: 招待トークン文字列
      responses:
        '200':
          description: グループ情報取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/join:
    post:
      summary: 家族グループ参加・招待トークン使用（FUN-GROUP-005）
      tags: [GROUP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupJoinRequest'
      responses:
        '200':
          description: 参加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{groupId}/members:
    get:
      summary: 家族メンバー一覧取得（FUN-GROUP-002）
      tags: [GROUP]
      parameters:
      - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: メンバー一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{groupId}/invite:
    post:
      summary: 家族グループ招待トークン発行（親のみ・FUN-GROUP-004）
      tags: [GROUP]
      parameters:
      - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: 招待トークン発行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{groupId}/members/{userId}:
    get:
      summary: 家族メンバー詳細取得（FUN-GROUP-003）
      tags: [GROUP]
      parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: メンバー詳細取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: 家族グループ脱退（親のみ・FUN-GROUP-006）
      tags: [GROUP]
      parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 脱退成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks:
    get:
      summary: タスク一覧取得・検索（FUN-TASK-006 / FUN-TASK-007）
      tags: [TASK]
      parameters:
      - name: groupId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TaskStatus'
      - name: assigneeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: keyword
        in: query
        required: false
        description: タスク名のキーワード検索・部分一致（FUN-TASK-007）
        schema:
          type: string
      - name: category
        in: query
        required: false
        description: 分類フィルタ・完全一致（FUN-TASK-007）。掃除 / 料理 / 洗濯 / その他
        schema:
          type: string
      - name: month
        in: query
        required: false
        description: |
          カレンダー表示用の対象月（YYYY-MM）。以下いずれかを満たすタスクを返す（FUN-TASK-005）。
          1. due_date が当月（JST）内
          2. start_time が当月（JST）内
          3. start_time が当月より前かつ end_time が当月以降（月をまたぐ複数日タスク）
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: タスク一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: タスク登録（親のみ・FUN-TASK-001）
      tags: [TASK]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: タスク登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/{taskId}:
    get:
      summary: タスク詳細取得
      tags: [TASK]
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: タスク詳細取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: タスク編集（親のみ・FUN-TASK-002）
      tags: [TASK]
      parameters:
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: タスク編集成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: タスク削除（親のみ・FUN-TASK-003）
      tags: [TASK]
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: タスク削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/status:
    patch:
      summary: タスクステータス変更・実行報告・承認・差し戻し（FUN-TASK-004）
      tags: [TASK]
      parameters:
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusUpdateRequest'
      responses:
        '200':
          description: ステータス変更成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /goals:
    get:
      summary: 目標一覧取得（FUN-GOAL-001）
      tags: [GOAL]
      parameters:
      - name: groupId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: targetMonth
        in: query
        required: false
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: 目標一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: 目標登録（親のみ・FUN-GOAL-003）
      tags: [GOAL]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
      responses:
        '201':
          description: 目標登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /goals/{goalId}:
    get:
      summary: 目標詳細取得（FUN-GOAL-002）
      tags: [GOAL]
      parameters:
      - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: 目標詳細取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: 目標編集（親のみ・FUN-GOAL-003）
      tags: [GOAL]
      parameters:
      - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdateRequest'
      responses:
        '200':
          description: 目標編集成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: 目標削除（親のみ・FUN-GOAL-004）
      tags: [GOAL]
      parameters:
      - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: 目標削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /goals/{goalId}/status:
    patch:
      summary: 目標ステータス変更（FUN-GOAL-005）
      tags: [GOAL]
      parameters:
      - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalStatusUpdateRequest'
      responses:
        '200':
          description: ステータス変更成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /rewards:
    get:
      summary: 月次報酬・評価の取得（FUN-REWARD-001・002）
      tags: [REWARD]
      parameters:
      - name: groupId
        in: query
        required: true
        description: 家族グループID（他家族データへのアクセス防止）
        schema:
          type: string
          format: uuid
      - name: childId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: targetMonth
        in: query
        required: true
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: 月次報酬取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rewards/{rewardId}/completions:
    get:
      summary: タスク別報酬明細の取得（FUN-REWARD-005）
      tags: [REWARD]
      parameters:
      - $ref: '#/components/parameters/RewardId'
      responses:
        '200':
          description: 報酬明細取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskCompletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rewards/{rewardId}/evaluation:
    post:
      summary: 月次評価の登録（親のみ・FUN-REWARD-003）
      tags: [REWARD]
      parameters:
      - $ref: '#/components/parameters/RewardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '200':
          description: 評価登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /rewards/{rewardId}/pay:
    post:
      summary: 支払い完了処理（親のみ）
      tags: [REWARD]
      parameters:
      - $ref: '#/components/parameters/RewardId'
      responses:
        '200':
          description: 支払い完了処理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /rewards/graph:
    get:
      summary: 報酬グラフ用データの取得・月次推移（FUN-REWARD-004）
      tags: [REWARD]
      parameters:
      - name: groupId
        in: query
        required: true
        description: 家族グループID（他家族データへのアクセス防止）
        schema:
          type: string
          format: uuid
      - name: childId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: targetMonth
        in: query
        required: true
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
      - name: historyMonths
        in: query
        required: false
        description: 推移データとして遡る月数（デフォルト6・最大12）
        schema:
          type: integer
          minimum: 1
          maximum: 12
          default: 6
      responses:
        '200':
          description: グラフデータ取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth が発行するJWTをBearerトークンとして指定する

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RewardId:
      name: rewardId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 認証エラー（トークン不正・未ログイン）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 権限エラー（ロール不足。親専用操作を子が実行した場合など）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: リソースが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UserRole:
      type: string
      enum: [parent, child]
      description: 続柄（親 / 子）

    TaskStatus:
      type: string
      enum: [pending, reported, completed, cancelled, expired]
      description: タスクステータス（pending=未対応 / reported=対応済 / completed=完了 / cancelled=キャンセル済 / expired=期限切れ）

    GoalStatus:
      type: string
      enum: [not_started, in_progress, pending_approval, achieved, failed]
